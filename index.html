<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta Refresh Redirect -->
    <meta http-equiv="refresh" content="0; url=https://tarekahmedsaleh.github.io/personal-portfolio/">
    <title>Redirecting to New Portfolio...</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            margin: 0 auto 24px;
            animation: spin 1s linear infinite;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px dotted #38bdf8;
            transition: color 0.2s ease;
        }
        a:hover {
            color: #7dd3fc;
            border-bottom-style: solid;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <!-- JavaScript Fallback Redirect -->
    <script type="text/javascript">
        window.location.href = "https://tarekahmedsaleh.github.io/personal-portfolio/";
    </script>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h1>Moving to My New Portfolio</h1>
        <p>You are being redirected automatically. If nothing happens, please <a href="https://tarekahmedsaleh.github.io/personal-portfolio/">click here to visit the new site</a>.</p>
    </div>

</body>
</html>
